apiVersion: v1
kind: ConfigMap
metadata:
  name: traccar-config
data:
  traccar.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE properties SYSTEM 'http://java.sun.com/dtd/properties.dtd'>
    <properties>
        <entry key='database.driver'>org.postgresql.Driver</entry>
        <entry key='database.url'>jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}</entry>
        <entry key='database.user'>${DB_USER}</entry>
        <entry key='database.password'>${DB_PASSWORD}</entry>

        <entry key='web.path'>./modern</entry>
        <entry key='web.port'>8082</entry>
        <entry key='database.changelog'>./schema/changelog-master.xml</entry>

        <entry key='geofence.polyline'>true</entry>
        <entry key='server.statistics'>https://www.traccar.org/analytics/</entry>
        <entry key='registration.enable'>true</entry>
        <entry key='server.registration'>true</entry>
    </properties>
---
apiVersion: v1
kind: Secret
metadata:
  name: geosurepath-secrets
type: Opaque
stringData:
  database-url: postgresql://geosurepath:PASSWORD@db:5432/geosurepath?schema=saas
  db-password: PASSWORD # Replace with actual password
  jwt-secret: geosurepath_jwt_secret_primary_key_2026
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: saas-api-config
data:
  PORT: "3001"
  NODE_ENV: "production"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  GEOSUREPATH_URL: "http://geosurepath-core:8082"
  DB_HOST: "db"
  DB_PORT: "5432"
  DB_NAME: "geosurepath"
  DB_USER: "geosurepath"
