apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: geosurepath-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: track.geosurepath.com # Replace with your domain
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: saas-api
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: geosurepath-core
            port:
              number: 8082
