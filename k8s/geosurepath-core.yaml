apiVersion: apps/v1
kind: Deployment
metadata:
  name: geosurepath-core
  labels:
    app: geosurepath-core
spec:
  replicas: 2
  selector:
    matchLabels:
      app: geosurepath-core
  template:
    metadata:
      labels:
        app: geosurepath-core
    spec:
      containers:
      - name: traccar
        image: traccar-core:latest # Replace with your actual image
        ports:
        - containerPort: 8082
        - containerPort: 5001
          protocol: TCP
        - containerPort: 5001
          protocol: UDP
        # Add more protocol ports as needed (5002-5150)
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: geosurepath-secrets
              key: database-url
        volumeMounts:
        - name: traccar-conf
          mountPath: /opt/traccar/conf/traccar.xml
          subPath: traccar.xml
        - name: traccar-data
          mountPath: /opt/traccar/data
      volumes:
      - name: traccar-conf
        configMap:
          name: traccar-config
      - name: traccar-data
        persistentVolumeClaim:
          claimName: traccar-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: geosurepath-core
spec:
  selector:
    app: geosurepath-core
  ports:
  - name: api
    port: 8082
    targetPort: 8082
  - name: protocol-5001-tcp
    port: 5001
    targetPort: 5001
    protocol: TCP
  - name: protocol-5001-udp
    port: 5001
    targetPort: 5001
    protocol: UDP
  # Add other protocols here
  type: LoadBalancer
