name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-size: 22
          cache: 'npm'
          cache-dependency-path: saas/package-lock.json

      - name: Install SaaS Dependencies
        run: |
          cd saas
          npm install --legacy-peer-deps

      - name: Prisma Validate
        run: |
          cd saas
          npx prisma validate

      - name: Build SaaS Docker Image
        run: |
          docker build -t geosurepath-saas:latest ./saas

      - name: Build Traccar Docker Image
        run: |
          docker build -t geosurepath-traccar:latest .
