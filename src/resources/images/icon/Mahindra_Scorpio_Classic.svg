<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 66 114" width="66" height="114">
  <!-- Body -->
  <rect x="5" y="7" width="56" height="100" rx="11" fill="#2a2a2a" stroke="#111" stroke-width="1.5"/>
  <!-- Hood -->
  <rect x="8" y="9" width="50" height="26" rx="7" fill="#222" stroke="#111" stroke-width="0.8"/>
  <!-- Front windshield -->
  <rect x="12" y="15" width="42" height="17" rx="4" fill="#4a6a8a" opacity="0.85" stroke="#2a4a6a" stroke-width="0.8"/>
  <!-- Roof -->
  <rect x="8" y="37" width="50" height="32" rx="5" fill="#1e1e1e" stroke="#111" stroke-width="0.8"/>
  <!-- Rear window -->
  <rect x="12" y="71" width="42" height="14" rx="4" fill="#4a6a8a" opacity="0.75" stroke="#2a4a6a" stroke-width="0.8"/>
  <!-- Boot -->
  <rect x="8" y="87" width="50" height="18" rx="7" fill="#222" stroke="#111" stroke-width="0.8"/>
  <!-- Front wheels -->
  <rect x="0" y="12" width="10" height="22" rx="4" fill="#111" stroke="#333" stroke-width="1"/>
  <rect x="56" y="12" width="10" height="22" rx="4" fill="#111" stroke="#333" stroke-width="1"/>
  <!-- Rear wheels -->
  <rect x="0" y="80" width="10" height="22" rx="4" fill="#111" stroke="#333" stroke-width="1"/>
  <rect x="56" y="80" width="10" height="22" rx="4" fill="#111" stroke="#333" stroke-width="1"/>
  <!-- Headlights (angular) -->
  <path d="M9,9 L26,9 L26,14 L9,14 Z" fill="#FFE870" stroke="#ccc" stroke-width="0.5"/>
  <path d="M40,9 L57,9 L57,14 L40,14 Z" fill="#FFE870" stroke="#ccc" stroke-width="0.5"/>
  <!-- DRL -->
  <line x1="9" y1="15" x2="26" y2="15" stroke="#FFE870" stroke-width="1.5"/>
  <line x1="40" y1="15" x2="57" y2="15" stroke="#FFE870" stroke-width="1.5"/>
  <!-- Tail lights -->
  <path d="M9,102 L24,102 L24,106 L9,106 Z" fill="#FF3333"/>
  <path d="M42,102 L57,102 L57,106 L42,106 Z" fill="#FF3333"/>
  <!-- Door lines -->
  <line x1="7" y1="66" x2="59" y2="66" stroke="#111" stroke-width="1"/>
  <!-- Spare tyre bump on rear -->
  <circle cx="33" cy="97" r="5" fill="#333" stroke="#222" stroke-width="1"/>
  <circle cx="33" cy="97" r="2.5" fill="#444"/>
  <!-- Mirrors -->
  <rect x="2" y="38" width="5" height="7" rx="2" fill="#2a2a2a" stroke="#111" stroke-width="1"/>
  <rect x="59" y="38" width="5" height="7" rx="2" fill="#2a2a2a" stroke="#111" stroke-width="1"/>
  <!-- Roof rack suggestion -->
  <line x1="13" y1="39" x2="13" y2="67" stroke="#333" stroke-width="1.5"/>
  <line x1="53" y1="39" x2="53" y2="67" stroke="#333" stroke-width="1.5"/>
</svg>