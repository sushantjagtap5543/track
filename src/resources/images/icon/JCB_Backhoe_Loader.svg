<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 130" width="90" height="130">
  <!-- Main body/chassis -->
  <rect x="18" y="38" width="54" height="54" rx="6" fill="#F5A623" stroke="#CC8800" stroke-width="1.5"/>
  <!-- Cabin -->
  <rect x="24" y="44" width="36" height="30" rx="4" fill="#E09000" stroke="#CC8800" stroke-width="1"/>
  <!-- Cabin windows -->
  <rect x="28" y="48" width="14" height="12" rx="2" fill="#AADDFF" opacity="0.8"/>
  <rect x="46" y="48" width="12" height="12" rx="2" fill="#AADDFF" opacity="0.8"/>
  <!-- Front loader arm (top) -->
  <rect x="20" y="8" width="50" height="32" rx="4" fill="#F5A623" stroke="#CC8800" stroke-width="1.2"/>
  <!-- Front loader bucket -->
  <rect x="14" y="4" width="62" height="12" rx="3" fill="#CC8800" stroke="#AA6600" stroke-width="1.5"/>
  <!-- Loader arm cylinders -->
  <rect x="24" y="10" width="6" height="28" rx="2" fill="#DDA000" stroke="#CC8800" stroke-width="0.8"/>
  <rect x="60" y="10" width="6" height="28" rx="2" fill="#DDA000" stroke="#CC8800" stroke-width="0.8"/>
  <!-- Backhoe arm (rear) -->
  <rect x="22" y="92" width="46" height="28" rx="4" fill="#F5A623" stroke="#CC8800" stroke-width="1.2"/>
  <!-- Backhoe bucket -->
  <path d="M28,120 L62,120 L66,130 L24,130 Z" fill="#CC8800" stroke="#AA6600" stroke-width="1.5"/>
  <!-- Stabilizer legs -->
  <rect x="2" y="110" width="18" height="8" rx="3" fill="#F5A623" stroke="#CC8800" stroke-width="1"/>
  <rect x="70" y="110" width="18" height="8" rx="3" fill="#F5A623" stroke="#CC8800" stroke-width="1"/>
  <!-- Rear wheels/tyres -->
  <ellipse cx="22" cy="78" rx="12" ry="14" fill="#111" stroke="#444" stroke-width="2"/>
  <ellipse cx="22" cy="78" rx="6" ry="7" fill="#333" stroke="#555" stroke-width="1"/>
  <ellipse cx="68" cy="78" rx="12" ry="14" fill="#111" stroke="#444" stroke-width="2"/>
  <ellipse cx="68" cy="78" rx="6" ry="7" fill="#333" stroke="#555" stroke-width="1"/>
  <!-- Front wheels/tyres -->
  <ellipse cx="22" cy="46" rx="10" ry="12" fill="#111" stroke="#444" stroke-width="2"/>
  <ellipse cx="22" cy="46" rx="5" ry="6" fill="#333" stroke="#555" stroke-width="1"/>
  <ellipse cx="68" cy="46" rx="10" ry="12" fill="#111" stroke="#444" stroke-width="2"/>
  <ellipse cx="68" cy="46" rx="5" ry="6" fill="#333" stroke="#555" stroke-width="1"/>
</svg>