<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 120" width="64" height="120">
  <!-- Body base -->
  <rect x="5" y="6" width="54" height="108" rx="8" fill="#E8E8E8" stroke="#999" stroke-width="1.5"/>
  <!-- Cabin section (front half) -->
  <rect x="8" y="8" width="48" height="52" rx="6" fill="#D8D8D8" stroke="#999" stroke-width="1"/>
  <!-- Windshield -->
  <rect x="12" y="14" width="40" height="20" rx="4" fill="#BBDDEE" opacity="0.85" stroke="#88AACC" stroke-width="0.8"/>
  <!-- Hood -->
  <rect x="10" y="9" width="44" height="14" rx="5" fill="#CCCCCC" stroke="#999" stroke-width="0.8"/>
  <!-- Roof of cabin -->
  <rect x="10" y="34" width="44" height="22" rx="3" fill="#C8C8C8" stroke="#999" stroke-width="0.8"/>
  <!-- Rear window of cabin -->
  <rect x="13" y="38" width="38" height="14" rx="3" fill="#BBDDEE" opacity="0.75"/>
  <!-- Pickup bed -->
  <rect x="8" y="62" width="48" height="50" rx="5" fill="#BBBBBB" stroke="#888" stroke-width="1"/>
  <!-- Bed interior -->
  <rect x="12" y="66" width="40" height="42" rx="3" fill="#AAAAAA" stroke="#777" stroke-width="0.8"/>
  <!-- Bed ridges -->
  <line x1="12" y1="76" x2="52" y2="76" stroke="#999" stroke-width="1"/>
  <line x1="12" y1="86" x2="52" y2="86" stroke="#999" stroke-width="1"/>
  <line x1="12" y1="96" x2="52" y2="96" stroke="#999" stroke-width="1"/>
  <!-- Front wheels -->
  <rect x="0" y="12" width="9" height="20" rx="4" fill="#111" stroke="#444" stroke-width="1"/>
  <rect x="55" y="12" width="9" height="20" rx="4" fill="#111" stroke="#444" stroke-width="1"/>
  <!-- Rear wheels (dual) -->
  <rect x="0" y="76" width="9" height="20" rx="4" fill="#111" stroke="#444" stroke-width="1"/>
  <rect x="55" y="76" width="9" height="20" rx="4" fill="#111" stroke="#444" stroke-width="1"/>
  <!-- Headlights -->
  <rect x="11" y="8" width="14" height="5" rx="2" fill="#FFE870" stroke="#ccc" stroke-width="0.5"/>
  <rect x="39" y="8" width="14" height="5" rx="2" fill="#FFE870" stroke="#ccc" stroke-width="0.5"/>
  <!-- Tail lights -->
  <rect x="9" y="109" width="12" height="4" rx="2" fill="#FF4444"/>
  <rect x="43" y="109" width="12" height="4" rx="2" fill="#FF4444"/>
</svg>