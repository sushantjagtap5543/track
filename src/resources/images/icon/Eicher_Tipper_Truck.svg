<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 74 140" width="74" height="140">
  <!-- Chassis -->
  <rect x="4" y="6" width="66" height="128" rx="7" fill="#CC2222" stroke="#991111" stroke-width="1.5"/>
  <!-- Cabin -->
  <rect x="7" y="8" width="60" height="40" rx="5" fill="#BB1111" stroke="#991111" stroke-width="0.8"/>
  <!-- Windshield -->
  <rect x="12" y="14" width="50" height="24" rx="4" fill="#AADDFF" opacity="0.85" stroke="#88AACC" stroke-width="0.8"/>
  <!-- Hood -->
  <rect x="9" y="9" width="56" height="14" rx="4" fill="#AA0000" stroke="#880000" stroke-width="0.8"/>
  <!-- Tipper body (raised/angled look) -->
  <rect x="7" y="52" width="60" height="78" rx="4" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1.2"/>
  <!-- Tipper body side lines -->
  <rect x="10" y="55" width="54" height="72" rx="3" fill="#F0F0F0"/>
  <!-- Tipper ridges -->
  <line x1="10" y1="66" x2="64" y2="66" stroke="#CCC" stroke-width="1.2"/>
  <line x1="10" y1="78" x2="64" y2="78" stroke="#CCC" stroke-width="1.2"/>
  <line x1="10" y1="90" x2="64" y2="90" stroke="#CCC" stroke-width="1.2"/>
  <line x1="10" y1="102" x2="64" y2="102" stroke="#CCC" stroke-width="1.2"/>
  <line x1="10" y1="114" x2="64" y2="114" stroke="#CCC" stroke-width="1.2"/>
  <!-- Rear gate -->
  <rect x="7" y="130" width="60" height="4" rx="2" fill="#CC2222" stroke="#991111" stroke-width="0.8"/>
  <!-- Front wheels -->
  <rect x="0" y="14" width="8" height="20" rx="4" fill="#111" stroke="#444" stroke-width="1"/>
  <rect x="66" y="14" width="8" height="20" rx="4" fill="#111" stroke="#444" stroke-width="1"/>
  <!-- Rear wheels (dual) -->
  <rect x="0" y="92" width="8" height="20" rx="4" fill="#111" stroke="#444" stroke-width="1"/>
  <rect x="66" y="92" width="8" height="20" rx="4" fill="#111" stroke="#444" stroke-width="1"/>
  <!-- Headlights -->
  <rect x="10" y="8" width="16" height="5" rx="2" fill="#FFE870" stroke="#ccc" stroke-width="0.5"/>
  <rect x="48" y="8" width="16" height="5" rx="2" fill="#FFE870" stroke="#ccc" stroke-width="0.5"/>
  <!-- Tail lights -->
  <rect x="10" y="131" width="14" height="4" rx="2" fill="#FF4444"/>
  <rect x="50" y="131" width="14" height="4" rx="2" fill="#FF4444"/>
  <!-- Mirrors -->
  <rect x="-2" y="34" width="6" height="5" rx="2" fill="#BB1111" stroke="#991111" stroke-width="0.8"/>
  <rect x="70" y="34" width="6" height="5" rx="2" fill="#BB1111" stroke="#991111" stroke-width="0.8"/>
</svg>