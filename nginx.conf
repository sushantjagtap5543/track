worker_processes 1;

events {
    worker_connections 8192; # Extreme capacity boost
}

http {
    include mime.types;
    default_type application/octet-stream;
    
    # Map for WebSockets
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
    
    # Gzip Compression for 0 Lag delivery
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
    gzip_proxied any;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    proxy_buffering off; # Critical for real-time responsiveness

    # Rate limiting for auth endpoints
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=20r/s;

    server {
        listen 80;
        server_name 3.108.114.12;

        # --- SaaS API Routes (specific, must come first) ---

        # SaaS Health
        location = /api/health {
            proxy_pass http://saas-api:3001/api/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # SaaS Pulse (Master Heartbeat)
        location = /api/pulse {
            proxy_pass http://saas-api:3001/api/pulse;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # SaaS Authentication
        location /api/auth/ {
            limit_req zone=auth_limit burst=50 nodelay;
            proxy_pass http://saas-api:3001/api/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SaaS Users
        location /api/users/ {
            proxy_pass http://saas-api:3001/api/users/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SaaS Vehicles
        location /api/vehicles/ {
            proxy_pass http://saas-api:3001/api/vehicles/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SaaS Billing
        location /api/billing/ {
            proxy_pass http://saas-api:3001/api/billing/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SaaS Admin
        location /api/admin/ {
            proxy_pass http://saas-api:3001/api/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SaaS Reports
        location /api/reports/ {
            proxy_pass http://saas-api:3001/api/reports/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # SaaS GeoSurePath proxy
        location /api/geosurepath/ {
            proxy_pass http://saas-api:3001/api/geosurepath/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # SaaS Notifications
        location /api/notifications/ {
            proxy_pass http://saas-api:3001/api/notifications/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # SaaS Webhooks
        location /api/webhooks/ {
            proxy_pass http://saas-api:3001/api/webhooks/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- GeoSurePath Core (Traccar) API and WebSockets ---
        # This MUST come after all specific /api/xxx/ SaaS routes
        # ✅ UNIVERSAL GATEWAY (S99): Close the direct engine bypass.
        # All Tracking Engine API calls are now routed through the SaaS Universal Proxy
        # to ensure 100% Just-in-Time Hardlock and AI Security Enforcement.
        location /api/ {
            proxy_pass http://saas-api:3001/api/geosurepath/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Disable buffering for real-time tracking accuracy
            proxy_buffering off;
        }

        # Socket.IO for real-time updates
        location /socket.io/ {
            proxy_pass http://saas-api:3001/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Aggressive Caching for Static Assets (0 Lag UI)
        location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|mp4)$ {
            proxy_pass http://geosurepath:8082;
            expires 7d;
            add_header Cache-Control "public, no-transform";
            access_log off;
        }

        # GeoSurePath Frontend (React SPA)
        location / {
            proxy_pass http://geosurepath:8082/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_intercept_errors on;
            error_page 404 = /index.html;
        }

        # SPA fallback
        location = /index.html {
            proxy_pass http://geosurepath:8082/index.html;
            internal;
        }
    }
}
