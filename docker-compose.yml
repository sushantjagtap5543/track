services:
  db:
    image: postgres:15-alpine
    container_name: traccar_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-traccar}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-traccar_db}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-traccar} -d $${POSTGRES_DB:-traccar_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
      - ./docker/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]


  redis:
    image: redis:7-alpine
    container_name: traccar_redis
    command: redis-server --appendonly yes
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

  traccar:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: traccar_engine
    restart: always
    environment:
      - DATABASE_URL=jdbc:postgresql://db:5432/traccar_db
      - DATABASE_USER=traccar
      - DATABASE_PASSWORD=${DB_PASSWORD}
      - CONFIG_USE_ENVIRONMENT_VARIABLES=true
      - JAVA_OPTS=-Xms512m -Xmx2g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/api/health"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 120s
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5001-5150:5001-5150/tcp"
      - "5001-5150:5001-5150/udp"
    volumes:
      - ./logs:/opt/traccar/logs:rw
      - ./data:/opt/traccar/data:rw
      - ./docker/traccar.xml:/opt/traccar/conf/traccar.xml:ro

  saas-api:
    build: ./saas
    container_name: traccar_saas_api
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      traccar:
        condition: service_healthy
    command: ["sh", "-c", "npx prisma db push --skip-generate --accept-data-loss && node scripts/seed_plans.js && node index.js"]
    # No direct port exposure (Nginx only)
    env_file:
      - ./saas/.env
    volumes:
      - ./saas/firebase-service-account.json:/app/firebase-service-account.json:ro
      - ./logs:/app/logs:rw
      - ./saas/data:/app/data:rw
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-traccar}:${DB_PASSWORD}@db:5432/${DB_NAME:-traccar_db}?schema=saas
      - REDIS_HOST=redis
      - TRACCAR_URL=http://traccar:8082
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GOOGLE_WEBHOOK_URL=${GOOGLE_WEBHOOK_URL}
      - JWT_SECRET=${JWT_SECRET}
      - TRACCAR_ADMIN_EMAIL=${TRACCAR_ADMIN_EMAIL}
      - TRACCAR_ADMIN_PASSWORD=${TRACCAR_ADMIN_PASSWORD}
      - SECURE_COOKIES=${SECURE_COOKIES:-false}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://3.108.114.12}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - NODE_ENV=production

  nginx:
    image: nginx:alpine
    container_name: traccar_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./traccar-web/build:/usr/share/nginx/html:ro
    depends_on:
      saas-api:
        condition: service_healthy
      traccar:
        condition: service_healthy

volumes:
  db_data:
  redis_data:
