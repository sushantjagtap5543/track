services:
  db:
    image: postgres:15-alpine
    container_name: geosurepath_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-geosurepath}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-geosurepath}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-geosurepath} -d $${POSTGRES_DB:-geosurepath}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - db_data:/var/lib/postgresql/data


  redis:
    image: redis:7-alpine
    container_name: geosurepath_redis
    command: redis-server --appendonly yes
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

  geosurepath:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geosurepath_traccar
    restart: always
    environment:
      - DATABASE_URL=jdbc:postgresql://db:5432/geosurepath
      - DATABASE_USER=geosurepath
      - DATABASE_PASSWORD=${DB_PASSWORD}
      - CONFIG_USE_ENVIRONMENT_VARIABLES=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5001-5150:5001-5150/tcp"
      - "5001-5150:5001-5150/udp"
    volumes:
      - ./logs:/opt/traccar/logs:rw
      - ./data:/opt/traccar/data:rw
      - ./docker/traccar.xml:/opt/traccar/conf/traccar.xml:ro

  saas-api:
    build: ./saas
    container_name: geosurepath_saas_api
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      geosurepath:
        condition: service_healthy
    command: ["sh", "-c", "npx prisma migrate deploy && node index.js"]
    # No direct port exposure (Nginx only)
    env_file:
      - ./saas/.env
    volumes:
      - ./saas/firebase-service-account.json:/app/firebase-service-account.json:ro
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-geosurepath}:${DB_PASSWORD}@db:5432/${DB_NAME:-geosurepath}?schema=saas
      - REDIS_HOST=redis
      - GEOSUREPATH_URL=http://geosurepath:8082

  nginx:
    image: nginx:alpine
    container_name: geosurepath_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      saas-api:
        condition: service_healthy
      geosurepath:
        condition: service_healthy

volumes:
  db_data:
  redis_data:
