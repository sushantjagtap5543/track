<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 110" width="60" height="110">
  <!-- Shadow -->
  <ellipse cx="30" cy="56" rx="24" ry="50" fill="rgba(0,0,0,0.08)"/>
  <!-- Car body -->
  <rect x="8" y="10" width="44" height="90" rx="12" ry="12" fill="#2255AA" stroke="#1a3d7c" stroke-width="1.5"/>
  <!-- Hood (front) -->
  <rect x="11" y="12" width="38" height="28" rx="8" fill="#1E4D99" stroke="#1a3d7c" stroke-width="0.8"/>
  <!-- Windshield front -->
  <rect x="14" y="18" width="32" height="18" rx="4" fill="#AADDFF" opacity="0.85" stroke="#7bbbd4" stroke-width="0.8"/>
  <!-- Roof -->
  <rect x="12" y="38" width="36" height="26" rx="5" fill="#1E4D99" stroke="#1a3d7c" stroke-width="0.8"/>
  <!-- Rear windshield -->
  <rect x="14" y="66" width="32" height="16" rx="4" fill="#AADDFF" opacity="0.75" stroke="#7bbbd4" stroke-width="0.8"/>
  <!-- Boot (rear) -->
  <rect x="11" y="80" width="38" height="18" rx="8" fill="#1E4D99" stroke="#1a3d7c" stroke-width="0.8"/>
  <!-- Front wheels -->
  <rect x="2" y="14" width="9" height="18" rx="4" fill="#111" stroke="#444" stroke-width="1"/>
  <rect x="49" y="14" width="9" height="18" rx="4" fill="#111" stroke="#444" stroke-width="1"/>
  <!-- Rear wheels -->
  <rect x="2" y="76" width="9" height="18" rx="4" fill="#111" stroke="#444" stroke-width="1"/>
  <rect x="49" y="76" width="9" height="18" rx="4" fill="#111" stroke="#444" stroke-width="1"/>
  <!-- Headlights -->
  <rect x="12" y="11" width="12" height="5" rx="2" fill="#FFE870" stroke="#ccc" stroke-width="0.5"/>
  <rect x="36" y="11" width="12" height="5" rx="2" fill="#FFE870" stroke="#ccc" stroke-width="0.5"/>
  <!-- Tail lights -->
  <rect x="12" y="96" width="12" height="5" rx="2" fill="#FF4444" stroke="#ccc" stroke-width="0.5"/>
  <rect x="36" y="96" width="12" height="5" rx="2" fill="#FF4444" stroke="#ccc" stroke-width="0.5"/>
  <!-- Door lines -->
  <line x1="10" y1="62" x2="50" y2="62" stroke="#1a3d7c" stroke-width="1"/>
  <!-- Mirrors -->
  <ellipse cx="6" cy="36" rx="3" ry="4" fill="#2255AA" stroke="#1a3d7c" stroke-width="1"/>
  <ellipse cx="54" cy="36" rx="3" ry="4" fill="#2255AA" stroke="#1a3d7c" stroke-width="1"/>
</svg>