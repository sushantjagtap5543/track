<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 100" width="40" height="100">
  <!-- Rear wheel -->
  <ellipse cx="20" cy="85" rx="10" ry="12" fill="#222" stroke="#555" stroke-width="1.5"/>
  <ellipse cx="20" cy="85" rx="5" ry="6" fill="#444" stroke="#666" stroke-width="1"/>
  <!-- Body -->
  <rect x="14" y="35" width="12" height="42" rx="5" fill="#1a1a1a" stroke="#444" stroke-width="1.2"/>
  <!-- Floor board -->
  <rect x="12" y="52" width="16" height="16" rx="3" fill="#333" stroke="#555" stroke-width="1"/>
  <!-- Front fairing -->
  <path d="M14,35 Q20,22 26,35" fill="#1a1a1a" stroke="#444" stroke-width="1.2"/>
  <rect x="15" y="28" width="10" height="10" rx="3" fill="#2a2a2a" stroke="#555" stroke-width="1"/>
  <!-- Windshield/headlight area -->
  <ellipse cx="20" cy="26" rx="6" ry="5" fill="#333" stroke="#555" stroke-width="1"/>
  <ellipse cx="20" cy="26" rx="4" ry="3" fill="#AADDFF" opacity="0.7"/>
  <!-- Handlebar -->
  <line x1="8" y1="32" x2="32" y2="32" stroke="#555" stroke-width="3" stroke-linecap="round"/>
  <!-- Front wheel -->
  <ellipse cx="20" cy="12" rx="10" ry="12" fill="#222" stroke="#555" stroke-width="1.5"/>
  <ellipse cx="20" cy="12" rx="5" ry="6" fill="#444" stroke="#666" stroke-width="1"/>
  <!-- Mirror -->
  <rect x="6" y="28" width="5" height="3" rx="1" fill="#333" stroke="#555" stroke-width="0.5"/>
  <rect x="29" y="28" width="5" height="3" rx="1" fill="#333" stroke="#555" stroke-width="0.5"/>
</svg>