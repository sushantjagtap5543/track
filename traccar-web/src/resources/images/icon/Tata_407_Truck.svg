<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 140" width="72" height="140">
  <!-- Body -->
  <rect x="4" y="5" width="64" height="130" rx="7" fill="#2E7D32" stroke="#1B5E20" stroke-width="1.5"/>
  <!-- Cabin -->
  <rect x="7" y="7" width="58" height="42" rx="5" fill="#256427" stroke="#1B5E20" stroke-width="0.8"/>
  <!-- Windshield -->
  <rect x="12" y="13" width="48" height="26" rx="4" fill="#AADDFF" opacity="0.85" stroke="#88AACC" stroke-width="0.8"/>
  <!-- Hood front -->
  <rect x="9" y="8" width="54" height="13" rx="4" fill="#2E7D32" stroke="#1B5E20" stroke-width="0.8"/>
  <!-- Cargo section -->
  <rect x="7" y="52" width="58" height="78" rx="4" fill="#388E3C" stroke="#1B5E20" stroke-width="0.8"/>
  <!-- Cargo interior -->
  <rect x="11" y="56" width="50" height="70" rx="3" fill="#2E7D32"/>
  <!-- Cargo ribs -->
  <line x1="11" y1="68" x2="61" y2="68" stroke="#1B5E20" stroke-width="1"/>
  <line x1="11" y1="80" x2="61" y2="80" stroke="#1B5E20" stroke-width="1"/>
  <line x1="11" y1="92" x2="61" y2="92" stroke="#1B5E20" stroke-width="1"/>
  <line x1="11" y1="104" x2="61" y2="104" stroke="#1B5E20" stroke-width="1"/>
  <line x1="11" y1="116" x2="61" y2="116" stroke="#1B5E20" stroke-width="1"/>
  <!-- Rear section -->
  <rect x="7" y="130" width="58" height="3" rx="2" fill="#256427"/>
  <!-- Front wheels -->
  <rect x="0" y="12" width="8" height="20" rx="4" fill="#111" stroke="#444" stroke-width="1"/>
  <rect x="64" y="12" width="8" height="20" rx="4" fill="#111" stroke="#444" stroke-width="1"/>
  <!-- Rear wheels (dual) -->
  <rect x="0" y="90" width="8" height="20" rx="4" fill="#111" stroke="#444" stroke-width="1"/>
  <rect x="64" y="90" width="8" height="20" rx="4" fill="#111" stroke="#444" stroke-width="1"/>
  <!-- Headlights -->
  <rect x="10" y="7" width="16" height="5" rx="2" fill="#FFE870" stroke="#ccc" stroke-width="0.5"/>
  <rect x="46" y="7" width="16" height="5" rx="2" fill="#FFE870" stroke="#ccc" stroke-width="0.5"/>
  <!-- Tail lights -->
  <rect x="10" y="130" width="14" height="4" rx="2" fill="#FF4444"/>
  <rect x="48" y="130" width="14" height="4" rx="2" fill="#FF4444"/>
  <!-- Mirrors -->
  <rect x="-2" y="36" rx="2" width="6" height="5" fill="#2E7D32" stroke="#1B5E20" stroke-width="1"/>
  <rect x="68" y="36" rx="2" width="6" height="5" fill="#2E7D32" stroke="#1B5E20" stroke-width="1"/>
</svg>