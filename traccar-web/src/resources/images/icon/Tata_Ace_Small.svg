<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 110" width="60" height="110">
  <!-- Body -->
  <rect x="4" y="5" width="52" height="100" rx="7" fill="#FFFFFF" stroke="#999" stroke-width="1.5"/>
  <!-- Cabin -->
  <rect x="7" y="7" width="46" height="40" rx="5" fill="#E8E8E8" stroke="#aaa" stroke-width="0.8"/>
  <!-- Windshield -->
  <rect x="11" y="12" width="38" height="22" rx="3" fill="#AADDFF" opacity="0.85" stroke="#88AACC" stroke-width="0.8"/>
  <!-- Hood -->
  <rect x="9" y="8" width="42" height="12" rx="4" fill="#DDDDDD" stroke="#aaa" stroke-width="0.8"/>
  <!-- Cargo bed -->
  <rect x="7" y="48" width="46" height="54" rx="4" fill="#CCCCCC" stroke="#888" stroke-width="1"/>
  <!-- Cargo bed interior -->
  <rect x="10" y="52" width="40" height="46" rx="3" fill="#BBBBBB"/>
  <!-- Cargo bed ribs -->
  <line x1="10" y1="62" x2="50" y2="62" stroke="#999" stroke-width="1"/>
  <line x1="10" y1="72" x2="50" y2="72" stroke="#999" stroke-width="1"/>
  <line x1="10" y1="82" x2="50" y2="82" stroke="#999" stroke-width="1"/>
  <line x1="10" y1="92" x2="50" y2="92" stroke="#999" stroke-width="1"/>
  <!-- Front wheels -->
  <rect x="0" y="10" width="8" height="16" rx="3" fill="#111" stroke="#444" stroke-width="1"/>
  <rect x="52" y="10" width="8" height="16" rx="3" fill="#111" stroke="#444" stroke-width="1"/>
  <!-- Rear wheels -->
  <rect x="0" y="74" width="8" height="16" rx="3" fill="#111" stroke="#444" stroke-width="1"/>
  <rect x="52" y="74" width="8" height="16" rx="3" fill="#111" stroke="#444" stroke-width="1"/>
  <!-- Headlights -->
  <rect x="9" y="7" width="12" height="4" rx="2" fill="#FFE870"/>
  <rect x="39" y="7" width="12" height="4" rx="2" fill="#FFE870"/>
  <!-- Tail lights -->
  <rect x="9" y="100" width="10" height="4" rx="2" fill="#FF4444"/>
  <rect x="41" y="100" width="10" height="4" rx="2" fill="#FF4444"/>
</svg>