<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 160" width="80" height="160">
  <!-- Bus body -->
  <rect x="4" y="6" width="72" height="148" rx="6" fill="#CC2222" stroke="#991111" stroke-width="2"/>
  <!-- Front section -->
  <rect x="7" y="8" width="66" height="22" rx="4" fill="#BB1111" stroke="#991111" stroke-width="1"/>
  <!-- Front windshield -->
  <rect x="12" y="10" width="56" height="16" rx="3" fill="#AADDFF" opacity="0.8" stroke="#88AACC" stroke-width="0.8"/>
  <!-- Roof -->
  <rect x="7" y="32" width="66" height="90" rx="2" fill="#BB1111" stroke="#991111" stroke-width="0.8"/>
  <!-- Windows row 1 -->
  <rect x="10" y="36" width="18" height="14" rx="2" fill="#AADDFF" opacity="0.75"/>
  <rect x="31" y="36" width="18" height="14" rx="2" fill="#AADDFF" opacity="0.75"/>
  <rect x="52" y="36" width="18" height="14" rx="2" fill="#AADDFF" opacity="0.75"/>
  <!-- Windows row 2 -->
  <rect x="10" y="54" width="18" height="14" rx="2" fill="#AADDFF" opacity="0.75"/>
  <rect x="31" y="54" width="18" height="14" rx="2" fill="#AADDFF" opacity="0.75"/>
  <rect x="52" y="54" width="18" height="14" rx="2" fill="#AADDFF" opacity="0.75"/>
  <!-- Windows row 3 -->
  <rect x="10" y="72" width="18" height="14" rx="2" fill="#AADDFF" opacity="0.75"/>
  <rect x="31" y="72" width="18" height="14" rx="2" fill="#AADDFF" opacity="0.75"/>
  <rect x="52" y="72" width="18" height="14" rx="2" fill="#AADDFF" opacity="0.75"/>
  <!-- Windows row 4 -->
  <rect x="10" y="90" width="18" height="14" rx="2" fill="#AADDFF" opacity="0.75"/>
  <rect x="31" y="90" width="18" height="14" rx="2" fill="#AADDFF" opacity="0.75"/>
  <rect x="52" y="90" width="18" height="14" rx="2" fill="#AADDFF" opacity="0.75"/>
  <!-- Rear section -->
  <rect x="7" y="124" width="66" height="28" rx="4" fill="#BB1111" stroke="#991111" stroke-width="1"/>
  <!-- Rear windshield -->
  <rect x="12" y="130" width="56" height="16" rx="3" fill="#AADDFF" opacity="0.7" stroke="#88AACC" stroke-width="0.8"/>
  <!-- Front wheels (dual) -->
  <rect x="0" y="10" width="7" height="16" rx="3" fill="#111" stroke="#444" stroke-width="1"/>
  <rect x="73" y="10" width="7" height="16" rx="3" fill="#111" stroke="#444" stroke-width="1"/>
  <!-- Middle wheels -->
  <rect x="0" y="68" width="7" height="16" rx="3" fill="#111" stroke="#444" stroke-width="1"/>
  <rect x="73" y="68" width="7" height="16" rx="3" fill="#111" stroke="#444" stroke-width="1"/>
  <!-- Rear wheels (dual) -->
  <rect x="0" y="88" width="7" height="16" rx="3" fill="#111" stroke="#444" stroke-width="1"/>
  <rect x="73" y="88" width="7" height="16" rx="3" fill="#111" stroke="#444" stroke-width="1"/>
  <!-- Headlights -->
  <rect x="9" y="7" width="20" height="5" rx="2" fill="#FFE870" stroke="#ccc" stroke-width="0.5"/>
  <rect x="51" y="7" width="20" height="5" rx="2" fill="#FFE870" stroke="#ccc" stroke-width="0.5"/>
  <!-- Tail lights -->
  <rect x="9" y="149" width="20" height="5" rx="2" fill="#FF4444" stroke="#ccc" stroke-width="0.5"/>
  <rect x="51" y="149" width="20" height="5" rx="2" fill="#FF4444" stroke="#ccc" stroke-width="0.5"/>
</svg>